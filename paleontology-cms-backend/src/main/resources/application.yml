server:
  port: 8089
  servlet:
    context-path: /

spring:
  application:
    name: paleontology-cms-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.chuanghai.paleo.cms.domain
  configuration:
    map-underscore-to-camel-case: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true

cms:
  jwt:
    secret: paleo-cms-jwt-secret-change-in-production-2026
    expire-minutes: 480
    header: Authorization
  upload:
    # 使用用户目录下的固定路径，避免 Tomcat 临时目录导致上传失败
    base-dir: ${user.home}/paleo-cms/uploads
    base-url: /uploads

knife4j:
  enable: true
  setting:
    language: zh-CN
